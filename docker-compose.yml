# 개발용. 호스트에는 웹(127.0.0.1:3000)만 연다. API·DB는 내부 네트워크에만 존재한다.
#   브라우저 → web(Next.js, BFF) → api → postgres ← worker → clamav
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  WEB_ORIGINS: ${WEB_ORIGINS:?}
  KEK_KEYS: ${KEK_KEYS:?}
  KEK_CURRENT: ${KEK_CURRENT:?}
  BIDX_KEY: ${BIDX_KEY:?}
  HIBP_ENABLED: ${HIBP_ENABLED:-true}
  DATABASE_URL: postgresql://resume_app:${APP_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # 1회성: DB 역할 부트스트랩 + 마이그레이션. 슈퍼유저 자격증명은 이 서비스에만 전달.
  migrate:
    <<: *hardening
    build: ./apps/api
    command: ["python", "-m", "app.cli", "migrate"]
    environment:
      ADMIN_DATABASE_URL: postgresql://${POSTGRES_ADMIN_USER}:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    restart: "no"

  api:
    <<: *hardening
    build: ./apps/api
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    # egress: 유출 비밀번호 검사(HIBP)용 외부 HTTPS
    networks: [data, app, egress]

  # 업로드 → 악성코드 스캔 → 격리 샌드박스 파싱. 외부망 없음(DB·스캐너만).
  worker:
    <<: *hardening
    build: ./apps/api
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *api-env
      CLAMD_HOST: clamav
    depends_on:
      migrate: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
    networks: [data, scan]
    mem_limit: 2g
    pids_limit: 64

  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    volumes: [clamdb:/var/lib/clamav]
    networks: [scan, egress]  # egress: 서명 DB 업데이트(freshclam)
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      retries: 20
      start_period: 300s

  web:
    <<: *hardening
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    tmpfs: [/tmp, /app/.next/cache]
    networks:
      app: { ipv4_address: 172.30.0.10 }  # API가 이 주소의 X-Forwarded-For만 신뢰
      public: {}
    ports: ["127.0.0.1:3000:3000"]

networks:
  data: { internal: true }
  app:
    internal: true
    ipam: { config: [{ subnet: 172.30.0.0/24 }] }
  scan: { internal: true }
  egress: {}
  public: {}

volumes:
  pgdata: {}
  clamdb: {}
